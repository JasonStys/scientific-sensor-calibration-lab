# Offline calibration verification by Jason Stys. Matrix/contracts: docs/VALIDATION.md.
# No Actions artifact/cache uploads; all profiles are synthetic source data, never downloaded in tests.
name: Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    name: Model / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "10.0.402", cache: false }
      - run: dotnet restore calibration-core --locked-mode
      - run: dotnet build calibration-core -c Release --no-restore
      - run: dotnet format whitespace calibration-core --no-restore --verify-no-changes
      - run: dotnet calibration-core/bin/Release/net10.0/CalibrationCore.dll --self-test
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m ruff check sensorlab tests tools launcher.py
      - run: python -m ruff format --check sensorlab tests tools launcher.py
      - run: python -m mypy sensorlab
      - run: python tools/verify_repo.py
      - run: python -m pytest --cov=sensorlab --cov-report=term-missing
      - run: python -m tools.benchmark
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python -m pip_audit --disable-pip --no-deps -r requirements-dev.lock
  browser:
    name: Browser / Chromium + Firefox + WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.14" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "10.0.402", cache: false }
      - run: dotnet restore calibration-core --locked-mode
      - run: dotnet build calibration-core -c Release --no-restore
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", package-manager-cache: false }
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run audit
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
  portable:
    name: Portable app / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.14" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "10.0.402", cache: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", package-manager-cache: false }
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci
      - run: npm run build
      - run: python tools/package_app.py
